<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowing History - Smart Library</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fa; color: #333; text-align: center; margin: 0; padding: 0; }
        h1 { color: #2c3e50; margin-top: 50px; font-size: 40px; }
        table { margin: 20px auto; border-collapse: collapse; width: 80%; }
        th, td { border: 1px solid #ccc; padding: 12px 15px; text-align: center; }
        th { background-color: #3498db; color: white; }
        tr:nth-child(even) { background-color: #ecf0f1; }
        a.button { display: inline-block; background: #3498db; color: white; padding: 8px 16px; margin: 5px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        a.button:hover { background: #2c3e50; color: #f1c40f; transform: scale(1.05); }
        .nav-home { margin-top: 30px; }
    </style>
</head>
<body>
    <h1>My Borrowing History</h1>
    <table>
        <tr>
            <th>Book Title</th>
            <th>Borrowed At</th>
            <th>Returned At</th>
            <th>Actions</th>
        </tr>
        <tr>
            <td>Book 1</td>
            <td>2026-01-01</td>
            <td>2026-01-05</td>
            <td>
                <a href="/borrow/return/1/" class="button">Return</a>
            </td>
        </tr>
        <tr>
            <td>Book 2</td>
            <td>2026-01-03</td>
            <td>Not Returned</td>
            <td>
                <a href="/borrow/return/2/" class="button">Return</a>
            </td>
        </tr>
    </table>

    <div class="nav-home">
        <a href="/" class="button">Home</a>
        <a href="/books/" class="button">View Books</a>
    </div>
</body>
</html>
