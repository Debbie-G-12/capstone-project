<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library</title>
    <style>
        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: #f5f7fa; /* light, clean background */
            color: #333;
        }

        /* Header */
        h1 {
            color: #2c3e50;
            margin-top: 60px;
            font-size: 44px;
            letter-spacing: 1px;
        }

        /* Subtext */
        p {
            font-size: 18px;
            margin: 15px 0 30px;
            color: #555;
        }

        /* Navigation Buttons */
        .nav-buttons a {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 12px 22px;
            margin: 8px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-buttons a:hover {
            background: #2c3e50;
            color: #f1c40f;
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            margin-top: 50px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <h1>Welcome to Smart Library!</h1>
    <p>This is my capstone project — a Smart Library Management System.</p>
    <p>Use the buttons below to explore books, authors, categories, and borrow/return features.</p>

    <div style="margin-top: 50px;">
        <a href="/books/"
           style="margin:15px; padding:20px 40px; background:#3498db; color:white; text-decoration:none; border-radius:10px; font-size:20px; display:inline-block;">
            View Books
        </a>
    
        <a href="/authors/"
           style="margin:15px; padding:20px 40px; background:#2ecc71; color:white; text-decoration:none; border-radius:10px; font-size:20px; display:inline-block;">
            View Authors
        </a>
    
        <a href="/categories/"
           style="margin:15px; padding:20px 40px; background:#9b59b6; color:white; text-decoration:none; border-radius:10px; font-size:20px; display:inline-block;">
            View Categories
        </a>
    
        <a href="/borrow/history/"
           style="margin:15px; padding:20px 40px; background:#e74c3c; color:white; text-decoration:none; border-radius:10px; font-size:20px; display:inline-block;">
            Borrowing History
        </a>
    </div>
    

    </div>
    
    

    <footer>
        &copy; 2026 Deborah Getachew Tefera | Capstone Project Demo
    </footer>
</body>
</html>
